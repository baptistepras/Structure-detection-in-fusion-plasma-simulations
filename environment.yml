# Environment for blob detection in Tokam2D simulations.
# Everything except Ultralytics comes from conda-forge, so the same file works
# on macOS arm64 (MPS) and on a Linux CUDA machine.
name: plasma-blobs
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pytorch>=2.3
  - torchvision
  - numpy
  - opencv          # image conversion, filters, patches
  - h5py            # challenge videos
  - pillow
  - pyyaml          # YOLO dataset files
  - matplotlib      # mosaics
  - pip
  - pip:
      - ultralytics>=8.1   # YOLOv8
